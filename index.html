<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIS Day Santa Clara 2026 | Yoh Kawano</title><meta name="description" content="Yoh Kawano. GIS Day Santa Clara 2026. UCLA, disaster ethnography, Human Error, and Reitaku."><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}#stage{width:100%;height:100%;position:relative;touch-action:pan-y}.slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#000}.slide.active{display:flex}.slide img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}.slide img.color{filter:none}.slide img.fit{object-fit:contain}h1{font-size:clamp(32px,5.5vw,90px);font-weight:400;line-height:1.15;letter-spacing:-.025em;max-width:85%;margin:0;text-align:center;text-wrap:balance}nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;justify-content:flex-end;align-items:center;gap:18px;padding:12px 22px;background:#000b;opacity:0;transition:opacity .15s}body.controls nav,nav:focus-within,nav:hover{opacity:1}button{color:#fff;background:none;border:0;font:16px Arial;padding:9px;cursor:pointer}button:disabled{opacity:.2;cursor:default}button:focus-visible{outline:2px solid white;outline-offset:3px}#count{font-size:12px;color:#aaa;font-variant-numeric:tabular-nums;margin-right:auto}dialog{background:#111;color:white;border:1px solid #555;width:min(700px,90vw);max-height:85vh;padding:28px}dialog::backdrop{background:#000c}dialog h2{font-size:22px;font-weight:400;margin-top:0}dialog p{font-size:16px;line-height:1.6}dialog .close{float:right}#overviewList{display:grid;grid-template-columns:1fr 1fr;gap:3px}#overviewList button{font-size:14px;text-align:left;padding:13px 8px;border-bottom:1px solid #333}#overviewList button:hover{background:#333}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}body.blank #stage{visibility:hidden}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media print{html,body{overflow:visible;height:auto}.slide{position:relative;display:flex!important;width:100vw;height:56.25vw;break-after:page;print-color-adjust:exact;-webkit-print-color-adjust:exact}nav,dialog{display:none!important}}</style></head><body><main id="stage" aria-label="GIS Day Santa Clara presentation"></main><nav aria-label="Presentation controls"><span id="count"></span><button id="prev" aria-label="Previous slide">←</button><button id="next" aria-label="Next slide">→</button><button id="grid" aria-label="Slide overview" title="Overview (O)">☷</button><button id="notes" aria-label="Speaker notes" title="Notes (N)">N</button><button id="fullscreen" aria-label="Fullscreen" title="Fullscreen (F)">⛶</button></nav><dialog id="overview"><button class="close" data-close>Close</button><h2>Slides</h2><div id="overviewList"></div></dialog><dialog id="speaker"><button class="close" data-close>Close</button><h2>Speaker notes</h2><p id="note"></p></dialog><div class="sr" id="announce" aria-live="polite"></div><script>const slides=[{"text": "Where does your memory live?", "note": "Opening question. Pause and let people think of a place before you introduce yourself."}, {"text": "Yoh Kawano", "note": "Introduce yourself in your own words. GIS Day Santa Clara, 2026."}, {"text": "UCLA, 2000", "note": "Start with your early work at UCLA and the Center for Neighborhood Knowledge."}, {"image": "nkla.jpg", "alt": "Neighborhood Knowledge Los Angeles: early web mapping interface", "color": true, "fit": true, "note": "Neighborhood Knowledge Los Angeles, 2000. Public access to neighborhood data."}, {"text": "2010", "note": ""}, {"image": "hypercities.jpg", "alt": "HyperCities: historical photographs layered into a three-dimensional city map", "color": true, "fit": true, "note": "HyperCities and thick mapping. Historical memory within geographic space."}, {"image": "urban-humanities.jpg", "alt": "UCLA Urban Humanities workshop", "color": false, "fit": false, "note": "Urban Humanities Initiative. Mapping and learning with people."}, {"text": "Banda Aceh, 2004", "note": "Disaster research. Introduce the 2004 Indian Ocean tsunami and your subsequent work in Aceh."}, {"image": "aceh-memory.jpg", "alt": "Archival photograph from the Banda Aceh research", "color": "", "fit": false, "note": "A photograph from your Aceh sequence. Speak to its specific history from your fieldwork."}, {"image": "aceh-before.jpg", "alt": "Banda Aceh satellite imagery, June 2004", "color": true, "fit": true, "note": "Banda Aceh before the tsunami. June 2004, as dated in the source deck."}, {"image": "aceh-after.jpg", "alt": "Banda Aceh satellite imagery, January 2005", "color": true, "fit": true, "note": "The same place after the tsunami. January 2005, as dated in the source deck."}, {"text": "Fukushima, 2011", "note": "The earthquake and nuclear disaster lead into your fieldwork. The following photographs document later research, not the day of the disaster."}, {"image": "fukushima-fieldwork.jpg", "alt": "Fieldwork team in protective clothing in Fukushima", "color": false, "fit": false, "note": "Your Fukushima fieldwork. Explain the monitoring and spatial research."}, {"image": "radiation-map.jpg", "alt": "Fukushima fieldwork mapping interface", "color": true, "fit": true, "note": "Radiation and spatial data from your fieldwork. Preserve map colors because they encode information."}, {"image": "namie.jpg", "alt": "A street in Namie Town", "color": false, "fit": false, "note": "Namie Town. Transition from the mapped landscape to lived experience."}, {"text": "What is missing from the map?", "note": "Drawn from your question in the source deck: 「地図」にないものは何？"}, {"text": "Spatial ethnography", "note": "The people whose stories changed the direction of the work."}, {"image": "tomoko.jpg", "alt": "Tomoko, inn owner, from the spatial ethnography portraits", "color": false, "fit": false, "note": "Tomoko, inn owner. Source deck identifies her by name and role."}, {"image": "sueko.jpg", "alt": "Sueko in her home, from the spatial ethnography portraits", "color": false, "fit": false, "note": "Sueko, displaced Namie resident. Speak from your own experience with her."}, {"image": "yoshizawa.jpg", "alt": "Yoshizawa, cattle farmer, from the spatial ethnography portraits", "color": false, "fit": false, "note": "Yoshizawa, cattle farmer. Source deck identifies him by name and role."}, {"text": "Human Error, 2019", "note": "Explain how listening and spatial ethnography led you to documentary film."}, {"image": "human-error.jpg", "alt": "Still from Human Error: a person in protective clothing on an outdoor staircase", "color": false, "fit": false, "note": "Human Error, 2019. Image from your portfolio."}, {"image": "screening.jpg", "alt": "Residents watching a film together in a room", "color": false, "fit": false, "note": "Film, dialogue, and the people who took part. This photograph is from the screening sequence in your source deck."}, {"text": "Reitaku", "note": "Describe the shift in your role toward mentorship and student-led work."}, {"image": "reitaku-film.jpg", "alt": "Students operating a camera during an interview in a pottery studio", "color": false, "fit": false, "note": "Student filmmaking. The camera passes into their hands."}, {"text": "Zemi", "note": "Your seminars and mentorship. Introduce how students lead their own projects."}, {"image": "reitaku-interview.jpg", "alt": "Student film crew conducting an interview in a home", "color": false, "fit": false, "note": "An image from your Reitaku source deck. Speak about learning together through fieldwork and filmmaking."}, {"image": "reitaku-community.jpg", "alt": "Yoh with students on a field", "color": false, "fit": false, "note": "A shared moment with students at Reitaku. Introduce your two presenters aloud without assigning unverified identities to this group photograph."}, {"text": "Over to you", "note": "Introduce your two beloved students by name and hand over the presentation."}];const stage=document.getElementById('stage');let current=0;let timer;slides.forEach((s,i)=>{let el=document.createElement('section');el.className='slide';el.setAttribute('aria-label',s.text||s.alt);el.setAttribute('aria-hidden','true');if(s.image){let im=new Image();im.src=s.image;im.alt=s.alt;im.className=[s.color?'color':'',s.fit?'fit':''].join(' ');im.draggable=false;el.append(im)}else{let h=document.createElement('h1');h.textContent=s.text;el.append(h)}stage.append(el);let b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+'  '+(s.text||s.alt);b.onclick=()=>{document.getElementById('overview').close();go(i)};document.getElementById('overviewList').append(b)});function go(i){current=Math.max(0,Math.min(slides.length-1,i));[...stage.children].forEach((el,n)=>{el.classList.toggle('active',n===current);el.setAttribute('aria-hidden',String(n!==current))});document.getElementById('count').textContent=(current+1)+' / '+slides.length;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;document.getElementById('note').textContent=slides[current].note||'';history.replaceState(null,'','#'+(current+1));document.getElementById('announce').textContent='Slide '+(current+1)}function controls(){document.body.classList.add('controls');clearTimeout(timer);timer=setTimeout(()=>document.body.classList.remove('controls'),1700)}async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{controls()}}document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('fullscreen').onclick=full;document.getElementById('grid').onclick=()=>document.getElementById('overview').showModal();document.getElementById('notes').onclick=()=>document.getElementById('speaker').showModal();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());document.addEventListener('mousemove',controls);document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]'))return;if(e.target.closest('button'))return;if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key==='Home')go(0);else if(e.key==='End')go(slides.length-1);else if(e.key.toLowerCase()==='f')full();else if(e.key.toLowerCase()==='o')document.getElementById('overview').showModal();else if(e.key.toLowerCase()==='n')document.getElementById('speaker').showModal();else if(e.key.toLowerCase()==='b')document.body.classList.toggle('blank')});let startX=0,startY=0;stage.addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX;startY=e.changedTouches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))go(current+(dx<0?1:-1));else controls()},{passive:true});stage.addEventListener('click',e=>{if(e.clientX>innerWidth*.65)go(current+1);else if(e.clientX<innerWidth*.35)go(current-1);else controls()});go(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));</script></body></html>
