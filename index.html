graphy led you to documentary film.", "emphasis": "Human Error"}, {"image": "human-error.jpg", "alt": "Still from Human Error: a person in protective clothing on an outdoor staircase", "color": false, "fit": false, "note": "Human Error, 2019. Image from your portfolio."}, {"image": "screening.jpg", "alt": "Residents watching a film together in a room", "color": false, "fit": false, "note": "Film, dialogue, and the people who took part. This photograph is from the screening sequence in your source deck."}, {"text": "Airi, 2026", "emphasis": "Airi", "note": "Airi. Current film work continuing the Fukushima narrative."}, {"image": "airi-still.jpg", "alt": "Airi looking out of a train window", "note": "Yoh’s portfolio. Airi, 2026.", "fit": false, "color": false}, {"image": "airi-interview-2025.jpg", "alt": "A camera filming a seated interview participant", "note": "Fukushima photo album. DSC_0295.JPG, October 2025.", "fit": false, "color": false}, {"image": "airi-shoot-wide.jpg", "alt": "Airi film shoot: interview participant and crew in a timber yard", "note": "Fukushima Airi Film Shoot Feb 21, 2026 album. IMG_8910.JPG.", "fit": false, "color": false}, {"image": "airi-shoot-camera.jpg", "alt": "Airi film shoot: the crew watching the camera", "note": "Fukushima Airi Film Shoot Feb 21, 2026 album. IMG_8913.JPG.", "fit": false, "color": false}, {"image": "airi-shoot-portrait.jpg", "alt": "Airi film shoot: a woman standing in the timber yard", "note": "Fukushima Airi Film Shoot Feb 21, 2026 album. IMG_8916.JPG.", "fit": false, "color": false}, {"text": "Reitaku", "note": "Describe the shift in your role toward mentorship and student-led work.", "emphasis": "Reitaku"}, {"image": "reitaku-film.jpg", "alt": "Students operating a camera during an interview in a pottery studio", "color": false, "fit": false, "note": "Student filmmaking. The camera passes into their hands."}, {"text": "Zemi", "note": "Your seminars and mentorship. Introduce how students lead their own projects.", "emphasis": "Zemi"}, {"image": "reitaku-interview.jpg", "alt": "Student film crew conducting an interview in a home", "color": false, "fit": false, "note": "An image from your Reitaku source deck. Speak about learning together through fieldwork and filmmaking."}, {"image": "reitaku-community.jpg", "alt": "Yoh with students on a field", "color": false, "fit": false, "note": "A shared moment with students at Reitaku. Introduce your two presenters aloud without assigning unverified identities to this group photograph."}, {"text": "Over to you", "note": "Introduce your two beloved students by name and hand over the presentation.", "emphasis": "you"}];const stage=document.getElementById('stage');let current=0;let timer;slides.forEach((s,i)=>{let el=document.createElement('section');el.className='slide';el.setAttribute('aria-label',s.text||s.alt);el.setAttribute('aria-hidden','true');if(s.image){let im=new Image();im.src=s.image;im.alt=s.alt;im.className=[s.color?'color':'',s.fit?'fit':''].join(' ');im.draggable=false;el.append(im)}else{let h=document.createElement('h1');if(s.emphasis&&s.text.includes(s.emphasis)){const at=s.text.indexOf(s.emphasis);const before=document.createElement('span');before.className='dim';before.textContent=s.text.slice(0,at);if(s.breakBefore){before.textContent=before.textContent.trimEnd();h.append(before,document.createElement('br'))}else h.append(before);const em=document.createElement('em');em.textContent=s.emphasis;h.append(em);const after=document.createElement('span');after.className='dim';after.textContent=s.text.slice(at+s.emphasis.length);h.append(after)}else h.textContent=s.text;el.append(h)}stage.append(el);let b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0')+'  '+(s.text||s.alt);b.onclick=()=>{document.getElementById('overview').close();go(i)};document.getElementById('overviewList').append(b)});function go(i){current=Math.max(0,Math.min(slides.length-1,i));[...stage.children].forEach((el,n)=>{el.classList.toggle('active',n===current);el.setAttribute('aria-hidden',String(n!==current))});document.getElementById('count').textContent=(current+1)+' / '+slides.length;document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1;document.getElementById('note').textContent=slides[current].note||'';history.replaceState(null,'','#'+(current+1));document.getElementById('announce').textContent='Slide '+(current+1)}function controls(){document.body.classList.add('controls');clearTimeout(timer);timer=setTimeout(()=>document.body.classList.remove('controls'),1700)}async function full(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{controls()}}document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('fullscreen').onclick=full;document.getElementById('grid').onclick=()=>document.getElementById('overview').showModal();document.getElementById('notes').onclick=()=>document.getElementById('speaker').showModal();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());document.addEventListener('mousemove',controls);document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]'))return;if(e.target.closest('button')&&e.key===' ')return;if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}else if(e.key==='Home')go(0);else if(e.key==='End')go(slides.length-1);else if(e.key.toLowerCase()==='f')full();else if(e.key.toLowerCase()==='o')document.getElementById('overview').showModal();else if(e.key.toLowerCase()==='n')document.getElementById('speaker').showModal();else if(e.key.toLowerCase()==='b')document.body.classList.toggle('blank')});let startX=0,startY=0;stage.addEventListener('touch
